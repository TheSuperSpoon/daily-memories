<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update password · Mel's Birthday World</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <main id="app">
      <section class="gate" aria-label="Password recovery">
        <div class="gate-panel">
          <p class="eyebrow">Private birthday site</p>
          <h1>Choose a new password</h1>
          <p class="gate-copy">This recovery link opens a short-lived private session.</p>
          <form id="recoveryForm" class="password-form">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
            <label for="confirmNewPassword">Confirm password</label>
            <input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required />
            <button id="recoverySubmit" type="submit">Update password</button>
            <p id="recoveryMessage" class="form-message" aria-live="polite">Checking recovery link...</p>
          </form>
          <a class="text-link" href="./index.html">Return to sign in</a>
        </div>
      </section>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./js/password-recovery.js"></script>
  </body>
</html>
