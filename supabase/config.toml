project_id = "daily-memories"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = [
  "http://localhost:5500",
  "http://localhost:5500/update-password.html",
  "http://127.0.0.1:5500/update-password.html"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.vector]
enabled = false
